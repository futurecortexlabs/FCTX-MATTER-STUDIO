[project]
name = "fctx-matter-studio"
version = "0.2.0"
description = "Touchless sensory evaluation of materials: GPU soft-matter physics (NVIDIA Warp XPBD), bare-hand webcam tracking, pseudo-haptics and a built-in psychophysics lab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FutureCortex Labs" }]
requires-python = ">=3.12,<3.13"
keywords = ["xpbd", "nvidia-warp", "soft-body", "cloth-simulation", "hand-tracking",
            "mediapipe", "pseudo-haptics", "psychophysics", "sensory-evaluation", "hci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "warp-lang>=1.7",
    "mediapipe>=0.10.18",
    "opencv-python>=4.10",
    "moderngl>=5.10",
    "glfw>=2.7",
    "numpy>=1.26",
    "pyglm>=2.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/futurecortexlabs/FCTX-MATTER-STUDIO"
Documentation = "https://github.com/futurecortexlabs/FCTX-MATTER-STUDIO/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
fctx = "fctx.__main__:main"
fctx-matter-studio = "fctx.__main__:main"
fctx-analyze = "fctx.analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fctx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "UP007", "UP045", "B023", "B905", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]
# Warp needs `x = int(0)` to declare a dynamic variable; the native-literal
# rule rewrites it to `x = 0`, which Warp then treats as a constant.
"src/fctx/solver/kernels.py" = ["UP018"]
