[project]
name = "fctx-matter-studio"
version = "0.1.0"
description = "Manipulate simulated matter with your bare hands. GPU XPBD physics (NVIDIA Warp) + real-time hand tracking."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "warp-lang>=1.7",
    "mediapipe>=0.10.18",
    "opencv-python>=4.10",
    "moderngl>=5.10",
    "glfw>=2.7",
    "numpy>=1.26",
    "pyglm>=2.7",
    "pillow>=10.0",
]

[project.scripts]
fctx-matter-studio = "fctx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fctx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "UP007", "UP045", "B023", "B905", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]
# Warp needs `x = int(0)` to declare a dynamic variable; the native-literal
# rule rewrites it to `x = 0`, which Warp then treats as a constant.
"src/fctx/solver/kernels.py" = ["UP018"]
