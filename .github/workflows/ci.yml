name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff check src tests tools

  cpu-tests:
    # The GPU-bound files (solver, render, smoke, resilience, study app) need
    # CUDA and an OpenGL context and run on a developer machine with
    # tools/run_tests.py.  Everything else -- geometry, colouring, tracking,
    # filters, the material model, the choreography, the venue layer, the
    # pseudo-haptics logic, the study state machine and its analysis -- runs
    # here, on both operating systems the studio ships for.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: install
        run: uv sync --frozen
      - name: hand model
        # Not committed (it is Google's, Apache-2.0, 7.8 MB); fetched and
        # sha256-checked exactly as a user's setup does, which also tests that.
        run: uv run python tools/download_models.py
      - name: cpu tests
        env:
          FCTX_DEVICE: cpu
        run: uv run python tools/run_tests.py --cpu
      - name: analysis CLI
        run: uv run fctx-analyze --help
