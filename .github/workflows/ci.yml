name: ci

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    # The GPU-bound files (solver, render, smoke, resilience) need CUDA and an OpenGL
    # context and run on the developer's machine with tools/run_tests.py.
    # Everything else -- geometry, colouring, tracking, filters, the material
    # model, the choreography, the application's control logic -- runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: install
        run: uv sync --frozen
      - name: lint
        run: uvx ruff check src tests tools
      - name: cpu tests
        env:
          FCTX_DEVICE: cpu
        run: uv run python tools/run_tests.py --cpu
